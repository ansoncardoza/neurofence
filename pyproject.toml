[project]
name = "neurofence"
version = "0.1.0"
description = "Autonomous AI model forensics and security assessment platform"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }

dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "safetensors>=0.4",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
ml = [
    "torch>=2.2",
    "transformers>=4.40",
    "sentence-transformers>=2.6",
]
report = [
    "reportlab>=4.1",
]
api = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.4",
    "mypy>=1.9",
]

[project.scripts]
neurofence = "neurofence.cli:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["neurofence*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N"]
# B008: typer/FastAPI use function calls in argument defaults by design (Option/Depends).
ignore = ["B008"]

[tool.mypy]
# Matches the installed numpy stubs, which use 3.12 syntax internally.
# requires-python stays >=3.11; this only controls stub/type-checking mode.
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
